# ================================================
# Nginx 配置 —— www.bykc.click
# 部署后拷到 /etc/nginx/sites-available/textgame
# 然后：ln -s /etc/nginx/sites-available/textgame /etc/nginx/sites-enabled/textgame
# 最后：nginx -t && systemctl reload nginx
# ================================================

# ---------- HTTP 80 端口（生产环境会再加 HTTPS 443） ----------
server {
    listen 80;
    server_name www.bykc.click 8.133.252.224;

    # 项目根目录
    root /opt/textgame;

    # ---------- 静态文件：Nginx 直接托管（不走 Gunicorn） ----------
    location /static/ {
        alias /opt/textgame/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- API 路由 + 页面：反代到 Gunicorn ----------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 禁止访问敏感目录 ----------
    location ~ /\. { deny all; }                     # .git / .env 等
    location ~ /\.(pyc|db|sqlite) { deny all; }       # .pyc / SQLite 文件

    # ---------- 日志 ----------
    access_log /var/log/nginx/textgame_access.log;
    error_log  /var/log/nginx/textgame_error.log;
}

