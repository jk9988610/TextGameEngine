<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Drawflow 手感 demo · 规范化版</title>
<link rel="stylesheet" href="demo-lib/drawflow.min.css">
<style>
:root {
  --card-bg:rgba(37,38,40,.92); --card-border:#3a3d45; --hl:#4d9fff;
  --text:#e6e8ec; --sub:#8b909b; --edge:#6b7280;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden;
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:#141518; color:var(--text); }

#hint {
  position:fixed; top:12px; left:12px; z-index:40;
  background:rgba(30,31,34,.92); border:1px solid #3a3d45; border-radius:8px;
  padding:8px 12px; font-size:12px; color:var(--sub); line-height:1.7;
}
#hint b { color:var(--text); }

#df {
  position:fixed; inset:0;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
    #1a1b1f;
  background-size:28px 28px;
}
#df:focus { outline:none; }
#df.grabbing, #df.grabbing * { cursor:grabbing !important; }

/* ===== 卡片规范化：严格保持 Drawflow 标准 DOM
   node > [.inputs] [.drawflow_content_node] [.outputs]
   output 圆点绝不移动出库结构（库靠 parentElement.parentElement.id 找节点），
   对齐选项行用 CSS 变量：--y1/--y2 由 JS 按行高写入。 ===== */
.drawflow .drawflow-node {
  width:260px; min-height:0; padding:0;
  display:flex; align-items:stretch;
  background:var(--card-bg);
  border:1.5px solid var(--card-border);
  border-radius:10px;
  color:var(--text);
  box-shadow:0 6px 22px rgba(0,0,0,.28);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.drawflow .drawflow-node.selected { background:var(--card-bg);
  border-color:var(--hl); box-shadow:0 0 0 3px rgba(77,159,255,.16); }

/* 左右端口列宽为 0（圆点压在卡片边缘线上） */
.drawflow .drawflow-node .inputs,
.drawflow .drawflow-node .outputs { width:0; }
.drawflow .drawflow-node .inputs  { display:flex; align-items:center; }
.drawflow .drawflow-node .outputs { display:block; position:relative; }

.drawflow_content_node { width:100%; position:relative; }

.n-head {
  font-size:11px; color:var(--sub); letter-spacing:.5px; text-transform:uppercase;
  padding:8px 11px; border-bottom:1px solid var(--card-border);
}
.n-text { padding:8px 11px; font-size:12.5px; line-height:1.55; }
.n-choice {
  display:flex; gap:7px; align-items:center;
  padding:7px 11px; font-size:12px; border-top:1px solid rgba(255,255,255,.04);
}
.n-choice::before { content:""; width:5px; height:5px; border-radius:50%;
  background:var(--sub); flex:none; }
.n-choice .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.n-choice .n { font-size:10.5px; color:var(--hl); }

/* 端口圆点：13px 压在卡片边缘线上。input 垂直居中；
   output 用节点上的 --yN 变量定位到第 N 条选项行中心（JS 写入） */
.drawflow .drawflow-node .input,
.drawflow .drawflow-node .output {
  position:absolute; width:13px; height:13px;
  background:#1a1b1f; border:2px solid var(--hl); border-radius:50%;
  cursor:crosshair; z-index:3; margin:0;
}
.drawflow .drawflow-node .input {
  left:-6.5px; top:50%; transform:translateY(-50%);
}
.drawflow .drawflow-node .output {
  right:-6.5px; transform:translateY(-50%);
  top:var(--y, 50%);
}
.drawflow .drawflow-node .output_1 { top:var(--y1, 50%); }
.drawflow .drawflow-node .output_2 { top:var(--y2, 50%); }
.drawflow .drawflow-node .output_3 { top:var(--y3, 50%); }
.drawflow .drawflow-node .output_4 { top:var(--y4, 50%); }
.drawflow .drawflow-node .output_5 { top:var(--y5, 50%); }
.drawflow .drawflow-node .output_6 { top:var(--y6, 50%); }
.drawflow .drawflow-node .output_7 { top:var(--y7, 50%); }
.drawflow .drawflow-node .output_8 { top:var(--y8, 50%); }

/* 连线 */
.drawflow .connection .main-path { stroke:var(--edge); stroke-width:2px; }
.drawflow .connection .main-path:hover { stroke:var(--hl); }
.drawflow .connection .main-path.selected { stroke:#4ade80; }
.drawflow-delete { background:#f87171; border:2px solid #1a1b1f; width:26px; height:26px;
  line-height:22px; border-radius:50%; }

#toolbar {
  position:fixed; top:12px; left:12px; z-index:40; display:flex; align-items:center; gap:6px;
  background:rgba(26,27,31,.92); border:1px solid #2f3239; border-radius:10px; padding:7px 9px;
}
.tb { border:1px solid #3a3d45; background:#26272b; color:var(--text);
  border-radius:7px; padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; }
.tb:hover { border-color:var(--hl); }
.tb.primary { background:var(--hl); border-color:var(--hl); color:#fff; }
.tb.danger { color:#fca5a5; }
.tb-sep { width:1px; height:20px; background:#3a3d45; margin:0 3px; }

/* JSON 面板：可编辑 + 复制/应用 */
#codepanel {
  position:fixed; top:52px; right:12px; width:330px; bottom:12px; z-index:30;
  background:rgba(26,27,31,.96); border:1px solid #2f3239; border-radius:10px;
  display:flex; flex-direction:column; overflow:hidden;
}
#codepanel .h { padding:8px 12px; font-size:12px; color:var(--sub);
  border-bottom:1px solid #2f3239; display:flex; align-items:center; gap:6px; }
#codepanel .h .sp { flex:1; }
#codepanel .h button { border:1px solid #3a3d45; background:#26272b; color:var(--text);
  border-radius:6px; padding:3px 9px; font-size:11.5px; cursor:pointer; font-family:inherit; }
#codepanel .h button:hover { border-color:var(--hl); }
#codepanel textarea {
  flex:1; width:100%; border:0; resize:none; background:transparent;
  color:#c8d4e8; padding:10px 12px; font-size:11.5px; line-height:1.6;
  font-family:Consolas,"Courier New",monospace; outline:none;
}

/* 框选矩形（屏幕坐标 fixed） */
#marquee {
  position:fixed; z-index:20; display:none; pointer-events:none;
  border:1.5px solid var(--hl); background:rgba(77,159,255,.10);
  border-radius:2px;
}
/* 多选高亮（与库单选 .selected 并存的独立标记） */
.drawflow-node.multi-sel {
  border-color:#7dd3fc; box-shadow:0 0 0 3px rgba(125,211,252,.25);
}
</style>
</head>
<body>

<div id="df"></div>
<div id="marquee"></div>

<div id="toolbar">
  <button id="btn-add" class="tb primary" title="在画布左上添加一张卡片">＋ 添加卡片</button>
  <button id="btn-sample" class="tb" title="脚本一键铺出示例内容（快速进入工作）">加载示例</button>
  <button id="btn-clear" class="tb danger" title="清空所有卡片和连线">清空画布</button>
  <span class="tb-sep"></span>
  <button id="zout" class="tb" title="缩小">－</button>
  <button id="zreset" class="tb" title="视图复位">⊙</button>
  <button id="zin" class="tb" title="放大">＋</button>
  <span class="tb-sep"></span>
  <button id="zreset-content" class="tb" title="清除本地保存并回到空白">重置存档</button>
</div>

<div id="codepanel">
  <div class="h"><span>nodes JSON（可编辑）</span><span class="sp"></span>
    <button id="btn-apply">应用</button><button id="btn-copy">复制</button>
  </div>
  <textarea id="code" spellcheck="false"></textarea>
</div>

<script src="demo-lib/drawflow.min.js"></script>
<script>
/* ========= 示例数据：仅供"加载示例"按钮/脚本一键铺底，初始画布是空的 ========= */
const SAMPLE = {
  greet: {
    x: 60, y: 90,
    text: "你好啊，旅行者。我是这片森林的守护者。",
    choices: [
      { text: "这片森林里有什么秘密吗？", next: "secret" },
      { text: "（默默离开）" },
    ]
  },
  secret: {
    x: 430, y: 150,
    text: "森林深处有个神秘洞穴，被锁住了，需要特殊钥匙。",
    choices: []
  },
  shop: {
    x: 60, y: 420,
    text: "治疗药水一瓶一个金币，明码标价。",
    choices: []
  }
};
let DATA = {};   // 初始空白

const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const editor = new Drawflow($("df"));
editor.start();
editor.force_first_input = true;   // 拖到卡片任意位置即接入其第一个（唯一）入口
editor.zoom_max = 1.6; editor.zoom_min = 0.4;

const idMap = {};   // drawflow 数字 id -> 我们的节点 id

/* ===== 模型 → 画布：DATA 重建整张图 ===== */
function renderGraph(data) {
  editor.clear();
  Object.keys(idMap).forEach(k => delete idMap[k]);

  for (const [id, n] of Object.entries(data)) {
    const html =
      `<div class="n-head">${id}</div><div class="n-text">${esc(n.text)}</div>` +
      n.choices.map((c, i) =>
        `<div class="n-choice" data-idx="${i}">` +
        `<span class="t">${esc(c.text || "（未填文字）")}</span>` +
        (c.next ? `<span class="n">→ ${c.next}</span>` : ``) + `</div>`).join("");
    const dfId = editor.addNode(id, 1, n.choices.length, n.x ?? 80, n.y ?? 80,
                                 "npc-node", {}, html);
    idMap[dfId] = id;
    placePorts(dfId, n.choices);
  }
  // 连线（output_N 对应第 N-1 个选项）
  for (const [id, n] of Object.entries(data)) {
    const dfFrom = dfIdOf(id);
    n.choices.forEach((c, i) => {
      if (c.next && data[c.next]) {
        editor.addConnection(dfFrom, dfIdOf(c.next), `output_${i+1}`, "input_1");
      }
    });
  }
  renderCode();
}
function dfIdOf(id) { return +Object.keys(idMap).find(k => idMap[k] === id); }

/* 端口对齐：圆点留在库标准 DOM 里（node>outputs>output_N，库靠此结构找节点），
   只测量第 i 条选项行中心，把纵坐标写进节点的 --y(i+1) CSS 变量，由 CSS 定位圆点。 */
function placePorts(dfId, choices) {
  const nodeEl = editor.precanvas.querySelector(`#node-${dfId}`);
  if (!nodeEl) return;
  const rows = [...nodeEl.querySelectorAll(".n-choice")];
  rows.forEach((row, i) => {
    const cy = row.offsetTop + row.offsetHeight / 2;
    nodeEl.style.setProperty(`--y${i+1}`, cy + "px");
  });
}

/* ===== 画布 → 模型：拉线/删线时同步 next。
   注意：此版本 Drawflow 的 on 回调直接收到 detail 对象（不是 DOM 事件）。 ===== */
function choiceIdx(cls) { return parseInt(String(cls).replace("output_",""),10)-1; }
editor.on("connectionCreated", d => {
  const from = idMap[d.output_id], to = idMap[d.input_id];
  const i = choiceIdx(d.output_class);
  if (from && to && DATA[from]?.choices[i]) {
    DATA[from].choices[i].next = to;
    renderCode(); persist();
  }
});
editor.on("connectionRemoved", d => {
  const from = idMap[d.output_id], i = choiceIdx(d.output_class);
  if (from && DATA[from]?.choices[i]) { delete DATA[from].choices[i].next; renderCode(); persist(); }
});

/* 节点删除（右键菜单删库自带节点；同步模型后重建保持一致）。回调参数直接是节点数字 id */
editor.on("nodeRemoved", dfId => {
  const id = idMap[dfId];
  if (!id) return;
  delete DATA[id];
  Object.values(DATA).forEach(n => n.choices.forEach(c => { if (c.next === id) delete c.next; }));
  renderGraph(DATA); persist();
});
/* 拖动结束 / 视图平移结束：保存坐标与画布位置 */
editor.on("nodeMoved", persist);
editor.on("mouseUp", persist);

/* ===== JSON 面板 ===== */
function publicData() {
  const out = {};
  for (const [id, n] of Object.entries(DATA)) {
    out[id] = { text:n.text, choices:n.choices.map(c => {
      const o = { text:c.text }; if (c.next) o.next=c.next; return o;
    })};
  }
  return out;
}
function renderCode() { $("code").value = JSON.stringify(publicData(), null, 2); }

$("btn-copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("code").value); $("btn-copy").textContent="已复制";
        setTimeout(()=>$("btn-copy").textContent="复制", 1200); }
  catch(_) { $("code").select(); }
};
$("btn-apply").onclick = () => {
  try {
    const obj = JSON.parse($("code").value);
    // 补坐标（编辑 JSON 时不带 x/y），新节点自动阶梯摆放
    let k = 0;
    for (const [id, n] of Object.entries(obj)) {
      if (n.x == null) { n.x = 60 + (k%3)*340; n.y = 90 + Math.floor(k/3)*220; }
      if (!Array.isArray(n.choices)) n.choices = [];
      k++;
    }
    DATA = obj;
    renderGraph(DATA);
    persist();
    flash("应用成功");
  } catch (err) { alert("JSON 解析失败：" + err.message); }
};
function flash(msg) {
  const b = $("btn-apply"); const old = b.textContent; b.textContent = msg;
  setTimeout(()=>b.textContent=old, 1000);
}

/* ===== 左键空白拖框多选 =====
   矩形与卡片都用屏幕坐标比较，天然不受缩放影响；卡片命中=矩形相交。
   这一步只做"选中+高亮"，批量拖动下一步。 */
const marquee = $("marquee");
let multiSel = new Set();   // 选中的 drawflow 数字 id
let dragBox = null;        // {x0,y0} 框选屏幕起点
let group = null;          // 整组拖动：{members:Map(id,{x,y}), lastX,lastY}

function isBlank(t) {
  return t.classList && (t.classList.contains("drawflow") ||
                         t.classList.contains("parent-drawflow"));
}
/* 活动数据路径（此版本 Drawflow）：editor.drawflow.drawflow.Home.data。
   注意 editor.export() 是 JSON 深拷贝，只能读不能写，拖动必须改活动对象。 */
const liveData = () => editor.drawflow.drawflow.Home.data;
function nodePos(id) {
  const d = liveData()[id];
  return { x: d.pos_x, y: d.pos_y };
}

/* 显式清除库的单选/连线选中（空白点击时我们拦了库的 mousedown，需自己做它本该做的事） */
function clearLibrarySelection() {
  editor.precanvas.querySelectorAll(".drawflow-node.selected")
    .forEach(el => el.classList.remove("selected"));
  editor.node_selected = null;
  const cs = editor.connection_selected;
  if (cs) {
    cs.classList.remove("selected");
    try { editor.removeReouteConnectionSelected(); } catch (_) {}
    editor.connection_selected = null;
  }
}

/* 统一用 mouse 事件链（与拦截的 mousedown 同一条链，避免 pointer/mouse 混用导致抬起丢失）。
   document 捕获：
   - 空白左键：库收不到 → 自己做框选/点击清除选中
   - 多选内的卡片左键：库收不到 → 整组由我们直接移动（不依赖库的领头卡时序）
   - 其余（单选卡片/端口/连线/右键/中键）：全部放行给库 */
document.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  if (isBlank(e.target)) {
    e.stopPropagation();
    dragBox = { x0: e.clientX, y0: e.clientY };
    marquee.style.display = "block";
    Object.assign(marquee.style, { left:e.clientX+"px", top:e.clientY+"px",
                                   width:"0px", height:"0px" });
    return;
  }
  const nodeEl = e.target.closest?.(".drawflow-node");
  if (nodeEl && multiSel.has(+nodeEl.id.slice(5))) {
    // 整组拖动：拦截库，自己按屏幕位移移动所有选中卡（坐标=屏幕位移/zoom）。
    // 增量式：保存每张卡【当前】位置 + 上一帧鼠标点，每帧只加本帧位移。
    e.stopPropagation();
    const members = new Map();
    multiSel.forEach(id => members.set(id, nodePos(id)));
    group = { members, lastX: e.clientX, lastY: e.clientY };
    $("df").classList.add("grabbing");
  }
}, true);

window.addEventListener("mousemove", e => {
  if (group) {
    const zoom = editor.zoom;
    // 屏幕上鼠标向右/向下为正 → 画布坐标也应增加
    const stepX = (e.clientX - group.lastX) / zoom;
    const stepY = (e.clientY - group.lastY) / zoom;
    group.lastX = e.clientX; group.lastY = e.clientY;
    group.members.forEach((p, id) => {
      const d = liveData()[id];
      d.pos_x = p.x + stepX; d.pos_y = p.y + stepY;
      p.x = d.pos_x; p.y = d.pos_y;       // 基准推进到本帧，下一帧在此基础上累加
      const el = editor.precanvas.querySelector(`#node-${id}`);
      if (el) { el.style.left = d.pos_x + "px"; el.style.top = d.pos_y + "px"; }
      editor.updateConnectionNodes(id);
    });
    return;
  }
  if (!dragBox) return;
  const x = Math.min(e.clientX, dragBox.x0), y = Math.min(e.clientY, dragBox.y0);
  Object.assign(marquee.style,
    { left:x+"px", top:y+"px",
      width:Math.abs(e.clientX - dragBox.x0)+"px",
      height:Math.abs(e.clientY - dragBox.y0)+"px" });
});

function endPointer(e) {
  // 整组拖动收尾
  if (group) {
    group = null;
    $("df").classList.remove("grabbing");
    persist();
    return;
  }
  if (!dragBox) return;
  const x1 = Math.min(e.clientX, dragBox.x0), y1 = Math.min(e.clientY, dragBox.y0);
  const x2 = Math.max(e.clientX, dragBox.x0), y2 = Math.max(e.clientY, dragBox.y0);
  dragBox = null;
  marquee.style.display = "none";

  if (Math.max(x2 - x1, y2 - y1) < 3) {
    // 空白【单击】：清除库单选 + 多选（替代库被拦掉的默认行为）
    clearLibrarySelection();
    clearMulti();
    return;
  }
  // 框选：与卡片屏幕矩形相交即命中（切换式：按住 Ctrl 追加，普通拖框重新选）
  const additive = e.ctrlKey || e.metaKey;
  if (!additive) clearMulti();
  editor.precanvas.querySelectorAll(".drawflow-node").forEach(el => {
    const r = el.getBoundingClientRect();
    const hit = r.left < x2 && r.right > x1 && r.top < y2 && r.bottom > y1;
    const id = +el.id.slice(5);
    if (hit) { multiSel.add(id); el.classList.add("multi-sel"); }
    else if (!additive) { multiSel.delete(id); el.classList.remove("multi-sel"); }
  });
}
window.addEventListener("mouseup", endPointer);
window.addEventListener("blur", () => { dragBox = null; group = null;
  marquee.style.display = "none"; $("df").classList.remove("grabbing"); });

function clearMulti() {
  multiSel.clear();
  editor.precanvas.querySelectorAll(".multi-sel")
    .forEach(el => el.classList.remove("multi-sel"));
}
/* 库选中一张卡：若不在当前多选中，清空多选，避免两套选中并存；在多选中则保留（供整组拖） */
editor.on("nodeSelected", id => { if (!multiSel.has(+id)) clearMulti(); });

/* ===== 控制台 API：不用截图即可用代码驱动画布 ===== */
window.graph = {
  help() {
    console.log([
      "graph.export()            查看当前 nodes JSON",
      "graph.addNode('id', x, y, '台词')  新增卡片",
      "graph.addChoice('greet', '选项文字', 'secret')  给卡片加选项并连线",
      "graph.connect('greet', 1, 'secret')  第1个选项(0起)连到目标",
      "graph.disconnect('greet', 1)        删除某选项的连线",
      "graph.load({...})        用 JSON 整体替换并重建",
      "graph.nodes()            查看 drawflow 原始序列化（含坐标）",
      "graph.selection()        查看当前框选的卡片",
    ].join("\n"));
  },
  export: () => publicData(),
  selection: () => [...multiSel].map(id => idMap[id]),
  nodes: () => editor.export(),
  addNode(id, x=80, y=80, text="新节点") {
    if (DATA[id]) return console.warn("已存在节点：" + id);
    DATA[id] = { x, y, text, choices: [] };
    renderGraph(DATA); persist();
  },
  addChoice(fromId, text, nextId) {
    const c = { text }; if (nextId) c.next = nextId;
    DATA[fromId].choices.push(c);
    renderGraph(DATA); persist();
  },
  connect(fromId, choiceIdx, toId) {
    if (!DATA[fromId].choices[choiceIdx]) DATA[fromId].choices[choiceIdx] = { text:"" };
    DATA[fromId].choices[choiceIdx].next = toId;
    renderGraph(DATA); persist();
  },
  disconnect(fromId, choiceIdx) {
    delete DATA[fromId].choices[choiceIdx]?.next;
    renderGraph(DATA); persist();
  },
  load(obj) { DATA = obj; renderGraph(DATA); persist(); },
};

/* ===== 持久化：刷新/重进恢复上次样子；坐标直接取库 export 的 pos_x/pos_y，零计算 ===== */
const LS_KEY = "drawflow_demo_v1";

function persist() {
  // 把库维护的坐标写回模型（结构仍是我们的 nodes，坐标只是附带字段）
  const exp = editor.export().drawflow.Home.data;
  for (const [dfId, d] of Object.entries(exp)) {
    const id = idMap[dfId];
    if (id && DATA[id]) { DATA[id].x = d.pos_x; DATA[id].y = d.pos_y; }
  }
  localStorage.setItem(LS_KEY, JSON.stringify({
    data: DATA,
    view: { x: editor.canvas_x, y: editor.canvas_y, zoom: editor.zoom },
  }));
}
function applyView(v) {
  if (!v) return;
  editor.canvas_x = v.x; editor.canvas_y = v.y; editor.zoom = v.zoom;
  editor.precanvas.style.transform =
    `translate(${v.x}px, ${v.y}px) scale(${v.zoom})`;
}
function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY));
    if (saved?.data) {
      DATA = saved.data;
      renderGraph(DATA);
      applyView(saved.view);
      return true;
    }
  } catch (_) { /* 存档损坏则回退初始 */ }
  return false;
}
function resetContent() {
  if (!confirm("清除本地保存并回到空白画布？")) return;
  localStorage.removeItem(LS_KEY);
  DATA = {};
  renderGraph(DATA);
  editor.zoom_reset();
}

/* 工具栏：添加卡片（在当前视图中央偏移摆放，不手算复杂坐标） */
let addSeq = 0;
$("btn-add").onclick = () => {
  const id = "node_" + (Object.keys(DATA).length + 1);
  // 放在画布坐标系下、当前视野左上区域，轻微错开避免重叠
  const x = Math.round(-editor.canvas_x / editor.zoom) + 120 + (addSeq % 5) * 26;
  const y = Math.round(-editor.canvas_y / editor.zoom) + 120 + (addSeq % 5) * 26;
  addSeq++;
  graph.addNode(id, x, y, "新节点");
};
$("btn-sample").onclick = () => {
  DATA = structuredClone(SAMPLE);
  renderGraph(DATA); persist();
};
$("btn-clear").onclick = () => {
  if (!confirm("清空画布？所有卡片、连线和本地保存都会删除。")) return;
  DATA = {};
  renderGraph(DATA); persist();
};
$("zin").onclick = () => editor.zoom_in();
$("zout").onclick = () => editor.zoom_out();
$("zreset").onclick = () => editor.zoom_reset();
$("zreset-content").onclick = resetContent;

// 启动：有本地存档恢复上次样子（含坐标/视图），否则保持空白
if (!loadSaved()) renderGraph(DATA);

</script>
</body>
</html>
