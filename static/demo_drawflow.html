<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>对话画布 demo · 网格/多NPC</title>
<link rel="stylesheet" href="demo-lib/drawflow.min.css">
<style>
:root {
  --card-bg:rgba(37,38,40,.92); --card-border:#3a3d45; --hl:#4d9fff;
  --text:#e6e8ec; --sub:#8b909b; --edge:#6b7280;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden;
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:#141518; color:var(--text); }

#df {
  position:fixed; top:48px; left:0; right:0; bottom:34px;
  --grid:28px;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
    #1a1b1f;
  background-size:var(--grid) var(--grid);
}
#df.grabbing, #df.grabbing * { cursor:grabbing !important; }

/* 卡片：统一宽 280 = 10 普通格(28)，位置吸附格点 */
.drawflow .drawflow-node {
  width:280px; min-height:0; padding:0; display:flex; align-items:stretch;
  background:var(--card-bg); border:1.5px solid var(--card-border); border-radius:10px;
  color:var(--text); box-shadow:0 6px 22px rgba(0,0,0,.28);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.drawflow .drawflow-node.selected { background:var(--card-bg);
  border-color:var(--hl); box-shadow:0 0 0 3px rgba(77,159,255,.16); }
.drawflow .drawflow-node .inputs,
.drawflow .drawflow-node .outputs { width:0; }
.drawflow .drawflow-node .inputs { display:flex; align-items:center; }
.drawflow .drawflow-node .outputs { display:block; position:relative; }
.drawflow_content_node { width:100%; position:relative; }
.n-head { font-size:11px; color:var(--sub); letter-spacing:.5px; text-transform:uppercase;
  padding:8px 11px; border-bottom:1px solid var(--card-border); }
.n-text { padding:8px 11px; font-size:12.5px; line-height:1.55; }
.n-choice { display:flex; gap:7px; align-items:center; padding:7px 11px; font-size:12px;
  border-top:1px solid rgba(255,255,255,.04); }
.n-choice::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--sub); flex:none; }
.n-choice .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.n-choice .n { font-size:10.5px; color:var(--hl); }

.drawflow .drawflow-node .input,
.drawflow .drawflow-node .output {
  position:absolute; width:13px; height:13px;
  background:#1a1b1f; border:2px solid var(--hl); border-radius:50%;
  cursor:crosshair; z-index:3; margin:0;
}
.drawflow .drawflow-node .input { left:-6.5px; top:50%; transform:translateY(-50%); }
.drawflow .drawflow-node .output { right:-6.5px; transform:translateY(-50%); top:var(--y,50%); }
.drawflow .drawflow-node .output_1{top:var(--y1,50%)} .drawflow .drawflow-node .output_2{top:var(--y2,50%)}
.drawflow .drawflow-node .output_3{top:var(--y3,50%)} .drawflow .drawflow-node .output_4{top:var(--y4,50%)}
.drawflow .drawflow-node .output_5{top:var(--y5,50%)} .drawflow .drawflow-node .output_6{top:var(--y6,50%)}
.drawflow .drawflow-node .output_7{top:var(--y7,50%)} .drawflow .drawflow-node .output_8{top:var(--y8,50%)}

.drawflow .connection .main-path { stroke:var(--edge); stroke-width:2px; }
.drawflow .connection .main-path:hover { stroke:var(--hl); }
.drawflow .connection .main-path.selected { stroke:#4ade80; }
.drawflow-delete { background:#f87171; border:2px solid #1a1b1f; width:26px; height:26px;
  line-height:22px; border-radius:50%; }

/* 顶栏（VS Code 风格通栏） */
#topbar { position:fixed; top:0; left:0; right:0; height:48px; z-index:40;
  display:flex; align-items:center; gap:6px; padding:0 10px;
  background:rgba(26,27,31,.96); border-bottom:1px solid #2f3239; }
#topbar .tb-title { font-size:13px; font-weight:600; color:var(--text); padding:0 4px; }
#topbar .sp { flex:1; }
#npc-select { background:#26272b; color:var(--text); border:1px solid #3a3d45; border-radius:7px;
  padding:6px 8px; font-size:12.5px; font-family:inherit; }

/* 右侧编辑栏：贴上顶栏(48)与底栏(34)，可整体滑出收纳 */
#codepanel {
  position:fixed; top:48px; right:0; bottom:34px; width:340px; z-index:30;
  background:rgba(26,27,31,.96); border-left:1px solid #2f3239;
  display:flex; flex-direction:column; overflow:hidden;
  transition: transform .16s ease, width .16s ease;
}
#codepanel.collapsed { transform: translateX(100%); }
#codepanel .h { padding:8px 12px; font-size:12px; color:var(--sub); border-bottom:1px solid #2f3239;
  display:flex; align-items:center; gap:6px; }
#codepanel .h .sp { flex:1; }
#codepanel .h button { border:1px solid #3a3d45; background:#26272b; color:var(--text); border-radius:6px;
  padding:3px 9px; font-size:11.5px; cursor:pointer; font-family:inherit; }
#codepanel .h button:hover { border-color:var(--hl); }
#codepanel textarea { flex:1; width:100%; border:0; resize:none; background:transparent; color:#c8d4e8;
  padding:10px 12px; font-size:11.5px; line-height:1.6;
  font-family:Consolas,"Courier New",monospace; outline:none; }
/* 编辑栏收纳后，顶栏抽屉钮给出激活态提示 */
#btn-toggle-panel.active { background:var(--hl); border-color:var(--hl); color:#fff; }
/* 顶栏通用按钮 */
.tb { border:1px solid #3a3d45; background:#26272b; color:var(--text); border-radius:7px;
  padding:6px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; white-space:nowrap; }
.tb:hover { border-color:var(--hl); }
.tb.primary { background:var(--hl); border-color:var(--hl); color:#fff; }
.tb.danger { color:#fca5a5; }
.tb-sep { width:1px; height:22px; background:#3a3d45; margin:0 2px; }

/* 底栏状态栏 */
#statusbar { position:fixed; left:0; right:0; bottom:0; height:34px; z-index:40;
  display:flex; align-items:center; gap:18px; padding:0 14px;
  background:rgba(26,27,31,.95); border-top:1px solid #2f3239; font-size:12px; color:var(--sub); }
#statusbar b { color:var(--text); font-weight:600; }
#statusbar .sp { flex:1; }
#statusbar label { display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none; }
#statusbar select { background:#26272b; color:var(--text); border:1px solid #3a3d45; border-radius:5px;
  padding:2px 5px; font-size:11.5px; font-family:inherit; }

/* 框选矩形 */
#marquee { position:fixed; z-index:20; display:none; pointer-events:none;
  border:1.5px solid var(--hl); background:rgba(77,159,255,.10); border-radius:2px; }
.drawflow-node.multi-sel { border-color:#7dd3fc; box-shadow:0 0 0 3px rgba(125,211,252,.25); }

/* 顶栏按钮（.tb 定义在下方统一处） */
</style>
</head>
<body>

<div id="df"></div>
<div id="marquee"></div>

<header id="topbar">
  <button id="btn-toggle-panel" class="tb" title="收纳/展开编辑栏（Ctrl+B）">☰</button>
  <span class="tb-title">对话画布</span>
  <span class="tb-sep"></span>
  <select id="npc-select" title="每个 NPC 的对话是一块独立画布"></select>
  <button id="btn-add" class="tb primary">＋ 添加卡片</button>
  <button id="btn-sample" class="tb">加载示例</button>
  <button id="btn-clear" class="tb danger">清空画布</button>
  <span class="tb-sep"></span>
  <button id="zout" class="tb">−</button>
  <button id="zreset" class="tb">⊙</button>
  <button id="zin" class="tb">＋</button>
  <span class="sp"></span>
  <button id="zreset-content" class="tb">重置存档</button>
</header>

<aside id="codepanel">
  <div class="h"><span>当前 NPC 的 nodes（可编辑）</span><span class="sp"></span>
    <button id="btn-apply">应用</button><button id="btn-copy">复制</button></div>
  <textarea id="code" spellcheck="false"></textarea>
</aside>

<div id="statusbar">
  <span>工程文件：<b>npc_dialogues.json</b></span>
  <span>画布：<b id="st-npc">—</b></span>
  <span>鼠标：<b id="st-xy">0, 0</b> 格</span>
  <span>缩放：<b id="st-zoom">100%</b></span>
  <span class="sp"></span>
  <label><input type="checkbox" id="chk-snap" checked> 吸附网格</label>
  <span>精度 <select id="sel-grid">
    <option value="28">普通 28</option>
    <option value="14">精细 14</option>
  </select></span>
</div>

<script src="demo-lib/drawflow.min.js"></script>
<script>
/* ===== 网格原子体系：普通 28 / 精细 14；卡宽 280=10 格；列距 15 格 ===== */
const G_COARSE=28, G_FINE=14, COL=15*G_COARSE;

/* 示例：两个 NPC，各自独立画布（取自游戏真实数据，坐标已对齐格点） */
const SAMPLE = {
  npc_1_drunk: {
    greet:{x:56,y:84,text:"（*巴尼眯着醉醺醺的眼睛盯着你*）你…你是新来的吧？坐下来喝一杯？",
      choices:[{text:"好啊，来一杯！",next:"drink_yes"},{text:"不用了，我只是路过。",next:"drink_no"}]},
    drink_yes:{x:56,y:252,text:"来来来，这杯我请！不过…这酒可不便宜哦。",
      choices:[{text:"算了，我身上没带钱。",next:"drink_no"}]},
    drink_no:{x:56,y:420,text:"哼，没眼光的小子…（*他耸耸肩又倒在桌上打呼噜*）",
      choices:[{text:"（离开）"}]},
    ask_key:{x:COL+56,y:84,text:"哦…有人早上把它丢在外面那棵老橡树下了。",
      choices:[{text:"谢谢提示！",next:"leave"}]},
    leave:{x:COL+56,y:252,text:"（*你悄悄离开了醉汉身边*）",choices:[]},
  },
  npc_2_sprite: {
    greet:{x:56,y:84,text:"你好啊，旅行者。我是这片森林的守护者。",
      choices:[{text:"这片森林里有什么秘密吗？",next:"secret"},
               {text:"这把钥匙开什么？",next:"has_key",if:{has_item:"rusty_key"}},
               {text:"（默默离开）"}]},
    secret:{x:56,y:336,text:"森林深处有个神秘洞穴，被锁住了，需要特殊钥匙。",
      choices:[{text:"多谢告诉我！"}]},
    has_key:{x:COL+56,y:84,text:"你可以用它打开森林西边的洞穴门，小心怪物。",
      choices:[{text:"好的，我去看看！"}]},
    after_kill:{x:2*COL+56,y:84,text:"你真的打败了哥布林？！你做了件了不起的事！",
      choices:[{text:"只是碰巧。",next:"after_kill_humble"},{text:"挺难对付的。",next:"after_kill_hard"}]},
    after_kill_hard:{x:2*COL+56,y:252,text:"来，让我为你祝福——",
      choices:[{text:"精神好多了！（最大HP+5）",next:"blessing_done",effects:[{type:"max_hp",amount:5}]}]},
    blessing_done:{x:2*COL+56,y:420,text:"愿风永远指引你的道路，旅行者。",choices:[{text:"再见"}]},
  }
};

let DATA = {};            // { npcId: { nodeId:{x,y,text,choices} } }
let currentNpc = null;
const cur = () => DATA[currentNpc] || {};
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const editor = new Drawflow($("df"));
editor.start();
editor.force_first_input = true;
editor.zoom_max = 1.6; editor.zoom_min = 0.4;

const idMap = {};
let snapOn = true, gridSize = G_COARSE;
const snap = v => snapOn ? Math.round(v/gridSize)*gridSize : Math.round(v);
const liveData = () => editor.drawflow.drawflow.Home.data;
const nodePos = id => { const d=liveData()[id]; return {x:d.pos_x,y:d.pos_y}; };

/* ===== 渲染当前 NPC 画布 ===== */
function renderGraph() {
  const data = cur();
  editor.clear();
  Object.keys(idMap).forEach(k=>delete idMap[k]);
  for (const [id,n] of Object.entries(data)) {
    const html = `<div class="n-head">${id}</div><div class="n-text">${esc(n.text)}</div>` +
      n.choices.map((c,i)=>`<div class="n-choice" data-idx="${i}"><span class="t">${esc(c.text||"（未填文字）")}</span>`+
        (c.next?`<span class="n">→ ${c.next}</span>`:``)+`</div>`).join("");
    const dfId = editor.addNode(id,1,n.choices.length,snap(n.x??2*G_COARSE),snap(n.y??3*G_COARSE),"npc-node",{},html);
    idMap[dfId]=id; placePorts(dfId);
  }
  for (const [id,n] of Object.entries(data)) n.choices.forEach((c,i)=>{
    if (c.next && data[c.next]) editor.addConnection(dfIdOf(id),dfIdOf(c.next),`output_${i+1}`,"input_1");
  });
  $("st-npc").textContent = currentNpc||"—";
  renderCode();
}
function dfIdOf(id){ return +Object.keys(idMap).find(k=>idMap[k]===id); }
function placePorts(dfId) {
  const el = editor.precanvas.querySelector(`#node-${dfId}`);
  if (!el) return;
  [...el.querySelectorAll(".n-choice")].forEach((row,i)=>
    el.style.setProperty(`--y${i+1}`, row.offsetTop+row.offsetHeight/2+"px"));
}

/* ===== 拉线/删线/删节点 ===== */
const choiceIdx = c => parseInt(String(c).replace("output_",""),10)-1;
editor.on("connectionCreated", d=>{
  const from=idMap[d.output_id], to=idMap[d.input_id], i=choiceIdx(d.output_class);
  if (from && to && cur()[from]?.choices[i]) { cur()[from].choices[i].next=to; renderCode(); persist(); }
});
editor.on("connectionRemoved", d=>{
  const from=idMap[d.output_id], i=choiceIdx(d.output_class);
  if (from && cur()[from]?.choices[i]) { delete cur()[from].choices[i].next; renderCode(); persist(); }
});
editor.on("nodeRemoved", dfId=>{
  const id=idMap[dfId]; if(!id) return;
  delete cur()[id];
  Object.values(cur()).forEach(n=>n.choices.forEach(c=>{ if(c.next===id) delete c.next; }));
  renderGraph(); persist();
});

/* 单卡拖动结束 → 吸附 */
editor.on("nodeMoved", dfId=>{
  const d=liveData()[dfId];
  if (snapOn) {
    d.pos_x=snap(d.pos_x); d.pos_y=snap(d.pos_y);
    const el=editor.precanvas.querySelector(`#node-${dfId}`);
    if (el) { el.style.left=d.pos_x+"px"; el.style.top=d.pos_y+"px"; }
    editor.updateConnectionNodes("node-"+dfId);
  }
  persist();
});
editor.on("mouseUp", persist);

/* ===== JSON 面板 ===== */
function publicData() {
  const out={};
  for (const [id,n] of Object.entries(cur()))
    out[id]={text:n.text,choices:n.choices.map(c=>{const o={text:c.text};if(c.next)o.next=c.next;return o;})};
  return out;
}
function renderCode(){ $("code").value=JSON.stringify(publicData(),null,2); }
$("btn-copy").onclick=async()=>{
  try{ await navigator.clipboard.writeText($("code").value); $("btn-copy").textContent="已复制";
       setTimeout(()=>$("btn-copy").textContent="复制",1200);}catch(_){ $("code").select(); }
};
$("btn-apply").onclick=()=>{
  try{
    const obj=JSON.parse($("code").value); let k=0;
    for (const [id,n] of Object.entries(obj)) {
      if (n.x==null){ n.x=2*G_COARSE+(k%2)*COL; n.y=3*G_COARSE+Math.floor(k/2)*168; }
      if (!Array.isArray(n.choices)) n.choices=[];
      k++;
    }
    DATA[currentNpc]=obj; renderGraph(); persist(); flash("应用成功");
  }catch(err){ alert("JSON 解析失败："+err.message); }
};
function flash(m){ const b=$("btn-apply"),o=b.textContent; b.textContent=m; setTimeout(()=>b.textContent=o,1000); }

/* ===== 框选 / 整组拖动 ===== */
const marquee=$("marquee");
let multiSel=new Set(), dragBox=null, group=null;
function isBlank(t){ return t.classList && (t.classList.contains("drawflow")||t.classList.contains("parent-drawflow")); }
function clearLibrarySelection(){
  editor.precanvas.querySelectorAll(".drawflow-node.selected").forEach(el=>el.classList.remove("selected"));
  editor.node_selected=null;
  if (editor.connection_selected){
    editor.connection_selected.classList.remove("selected");
    try{ editor.removeReouteConnectionSelected(); }catch(_){}
    editor.connection_selected=null;
  }
}
document.addEventListener("mousedown", e=>{
  if (e.button!==0) return;
  if (isBlank(e.target)){
    e.stopPropagation();
    dragBox={x0:e.clientX,y0:e.clientY};
    marquee.style.display="block";
    Object.assign(marquee.style,{left:e.clientX+"px",top:e.clientY+"px",width:"0px",height:"0px"});
    return;
  }
  const nodeEl=e.target.closest?.(".drawflow-node");
  if (nodeEl && multiSel.has(+nodeEl.id.slice(5))){
    e.stopPropagation();
    const members=new Map();
    multiSel.forEach(id=>members.set(id,nodePos(id)));
    group={members,lastX:e.clientX,lastY:e.clientY};
    $("df").classList.add("grabbing");
  }
}, true);
window.addEventListener("mousemove", e=>{
  if (group){
    const z=editor.zoom;
    const sx=(e.clientX-group.lastX)/z, sy=(e.clientY-group.lastY)/z;
    group.lastX=e.clientX; group.lastY=e.clientY;
    group.members.forEach((p,id)=>{
      const d=liveData()[id];
      d.pos_x=p.x+sx; d.pos_y=p.y+sy; p.x=d.pos_x; p.y=d.pos_y;
      const el=editor.precanvas.querySelector(`#node-${id}`);
      if (el){ el.style.left=d.pos_x+"px"; el.style.top=d.pos_y+"px"; }
    });
    group.members.forEach((_p,id)=>editor.updateConnectionNodes("node-"+id));
  } else if (dragBox){
    Object.assign(marquee.style,{
      left:Math.min(e.clientX,dragBox.x0)+"px", top:Math.min(e.clientY,dragBox.y0)+"px",
      width:Math.abs(e.clientX-dragBox.x0)+"px", height:Math.abs(e.clientY-dragBox.y0)+"px"});
  }
  updateCoord(e.clientX,e.clientY);
});
window.addEventListener("mouseup", e=>{
  if (group){
    if (snapOn) group.members.forEach((_p,id)=>{
      const d=liveData()[id];
      d.pos_x=snap(d.pos_x); d.pos_y=snap(d.pos_y);
      const el=editor.precanvas.querySelector(`#node-${id}`);
      if (el){ el.style.left=d.pos_x+"px"; el.style.top=d.pos_y+"px"; }
    });
    group.members.forEach((_p,id)=>editor.updateConnectionNodes("node-"+id));
    group=null; $("df").classList.remove("grabbing"); persist(); return;
  }
  if (!dragBox) return;
  const x1=Math.min(e.clientX,dragBox.x0), y1=Math.min(e.clientY,dragBox.y0);
  const x2=Math.max(e.clientX,dragBox.x0), y2=Math.max(e.clientY,dragBox.y0);
  dragBox=null; marquee.style.display="none";
  if (Math.max(x2-x1,y2-y1)<3){ clearLibrarySelection(); clearMulti(); return; }
  const add=e.ctrlKey||e.metaKey; if(!add) clearMulti();
  editor.precanvas.querySelectorAll(".drawflow-node").forEach(el=>{
    const r=el.getBoundingClientRect();
    const hit=r.left<x2&&r.right>x1&&r.top<y2&&r.bottom>y1, id=+el.id.slice(5);
    if (hit){ multiSel.add(id); el.classList.add("multi-sel"); }
    else if(!add){ multiSel.delete(id); el.classList.remove("multi-sel"); }
  });
});
window.addEventListener("blur",()=>{ dragBox=null; group=null;
  marquee.style.display="none"; $("df").classList.remove("grabbing"); });
function clearMulti(){ multiSel.clear();
  editor.precanvas.querySelectorAll(".multi-sel").forEach(el=>el.classList.remove("multi-sel")); }
editor.on("nodeSelected", id=>{ if(!multiSel.has(+id)) clearMulti(); });

/* ===== 状态栏 ===== */
function updateCoord(cx,cy){
  const r=$("df").getBoundingClientRect();
  const wx=(cx-r.left-editor.canvas_x)/editor.zoom, wy=(cy-r.top-editor.canvas_y)/editor.zoom;
  $("st-xy").textContent=`${Math.round(wx/gridSize)}, ${Math.round(wy/gridSize)}`;
}
function updateZoom(){ $("st-zoom").textContent=Math.round(editor.zoom*100)+"%"; }
editor.on("zoom",updateZoom); editor.on("translate",updateZoom);
$("chk-snap").onchange=e=>{ snapOn=e.target.checked; persist(); };
$("sel-grid").onchange=e=>{ gridSize=+e.target.value;
  $("df").style.setProperty("--grid",gridSize+"px"); renderGraph(); persist(); };

/* ===== NPC 画布切换 ===== */
const npcSel=$("npc-select");
function refreshNpcOptions(){
  const ids=[...new Set([...Object.keys(SAMPLE),...Object.keys(DATA)])].sort();
  npcSel.innerHTML=ids.map(id=>`<option value="${id}"${id===currentNpc?" selected":""}>${id}</option>`).join("");
}
npcSel.onchange=()=>{
  persist();
  currentNpc=npcSel.value;
  if(!DATA[currentNpc]) DATA[currentNpc]={};
  renderGraph(); applyView(savedView()); persist();
};

/* ===== 控制台 API ===== */
window.graph={
  help(){ console.log(["graph.npc / graph.use(id)","graph.export()","graph.addNode(id,'台词')",
    "graph.addChoice/addConnect/connect/disconnect","graph.snap(true,28)","graph.load({...})"].join("\n")); },
  get npc(){ return currentNpc; },
  use(id){ npcSel.value=id; npcSel.onchange(); },
  export:publicData,
  selection:()=>[...multiSel].map(id=>idMap[id]),
  nodes:()=>editor.export(),
  addNode(id,text="新节点"){
    if(cur()[id]) return console.warn("已存在："+id);
    cur()[id]={x:snap(-editor.canvas_x/editor.zoom+2*G_COARSE),y:snap(-editor.canvas_y/editor.zoom+3*G_COARSE),text,choices:[]};
    renderGraph(); persist();
  },
  addChoice(f,t,to){ const c={text:t}; if(to)c.next=to; cur()[f].choices.push(c); renderGraph(); persist(); },
  connect(f,i,to){ if(!cur()[f].choices[i])cur()[f].choices[i]={text:""}; cur()[f].choices[i].next=to; renderGraph(); persist(); },
  disconnect(f,i){ delete cur()[f].choices[i]?.next; renderGraph(); persist(); },
  snap(on,g){ snapOn=!!on; if(g){gridSize=+g;$("sel-grid").value=g;$("df").style.setProperty("--grid",g+"px");} },
  load(o){ DATA[currentNpc]=o; renderGraph(); persist(); },
};

/* ===== 持久化（v2：按 NPC 隔离 + 各自视图 + 网格设置） ===== */
const LS_KEY="drawflow_demo_v2";
function persist(){
  for (const [dfId,d] of Object.entries(editor.export().drawflow.Home.data)){
    const id=idMap[dfId]; if(id && cur()[id]){ cur()[id].x=d.pos_x; cur()[id].y=d.pos_y; }
  }
  const all=JSON.parse(localStorage.getItem(LS_KEY)||"{}");
  all.data=DATA; all.currentNpc=currentNpc; all.views=all.views||{};
  all.views[currentNpc]={x:editor.canvas_x,y:editor.canvas_y,zoom:editor.zoom};
  all.snap=snapOn; all.grid=gridSize;
  localStorage.setItem(LS_KEY,JSON.stringify(all));
}
function savedView(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}").views?.[currentNpc]; }catch(_){return null;} }
function applyView(v){
  if(!v){ editor.zoom_reset(); updateZoom(); return; }
  editor.canvas_x=v.x??0; editor.canvas_y=v.y??0; editor.zoom=v.zoom??1;
  editor.precanvas.style.transform=`translate(${editor.canvas_x}px, ${editor.canvas_y}px) scale(${editor.zoom})`;
  updateZoom();
}
function resetAll(){
  if(!confirm("清除本地保存并回到空白？")) return;
  localStorage.removeItem(LS_KEY);
  DATA={}; currentNpc=null; npcSel.value=""; refreshNpcOptions(); renderGraph(); editor.zoom_reset();
}

/* ===== 工具栏 ===== */
$("btn-add").onclick=()=>{ if(currentNpc) graph.addNode("node_"+(Object.keys(cur()).length+1)); };
$("btn-sample").onclick=()=>{
  DATA=structuredClone(SAMPLE);
  const first=Object.keys(DATA)[0];
  refreshNpcOptions(); currentNpc=first; npcSel.value=first;
  renderGraph(); applyView(null); persist();
};
$("btn-clear").onclick=()=>{ if(!currentNpc)return;
  if(!confirm(`清空「${currentNpc}」画布？`))return;
  DATA[currentNpc]={}; renderGraph(); persist(); };
$("zin").onclick=()=>editor.zoom_in();
$("zout").onclick=()=>editor.zoom_out();
$("zreset").onclick=()=>editor.zoom_reset();
$("zreset-content").onclick=resetAll;

/* ===== 右侧编辑栏收纳（VS Code 抽屉，Ctrl+B） ===== */
const panel = $("codepanel"), btnPanel = $("btn-toggle-panel");
function setPanel(open) {
  panel.classList.toggle("collapsed", !open);
  btnPanel.classList.toggle("active", !open);
  try { localStorage.setItem("drawflow_panel_open", open ? "1" : "0"); } catch(_) {}
}
btnPanel.onclick = () => setPanel(panel.classList.contains("collapsed"));
window.addEventListener("keydown", e => {
  if ((e.ctrlKey||e.metaKey) && (e.key==="b"||e.key==="B")) { e.preventDefault();
    setPanel(panel.classList.contains("collapsed")); }
});
try { if (localStorage.getItem("drawflow_panel_open") === "0") setPanel(false); } catch(_) {}

/* ===== 启动：恢复存档；否则空白 ===== */
(function init(){
  refreshNpcOptions();
  let s=null; try{ s=JSON.parse(localStorage.getItem(LS_KEY)); }catch(_){}
  if (s?.data){
    DATA=s.data; snapOn=s.snap!==false; gridSize=s.grid||G_COARSE;
    $("chk-snap").checked=snapOn; $("sel-grid").value=gridSize;
    $("df").style.setProperty("--grid",gridSize+"px");
    currentNpc=s.currentNpc && DATA[s.currentNpc] ? s.currentNpc : Object.keys(DATA)[0];
    refreshNpcOptions(); npcSel.value=currentNpc||"";
    renderGraph(); if(currentNpc) applyView(savedView());
  } else renderGraph();
  updateZoom();
})();
</script>
</body>
</html>
